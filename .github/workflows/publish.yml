name: "Publish"

# `published` (not `created`): a draft release that is published later never
# fires `created`, which would skip the PyPI upload while other release
# workflows still run.
on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs derives the package version from git tags
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build spectral-bridge
        run: uv build
      - name: Publish spectral-bridge
        # --check-url skips files already on PyPI so workflow re-runs stay green
        run: uv publish --check-url https://pypi.org/simple/

      - name: Build spectral-bridge-adapter-pass-through
        run: uv build --directory adapters/pass-through
      - name: Publish spectral-bridge-adapter-pass-through
        run: uv publish --directory adapters/pass-through --check-url https://pypi.org/simple/
