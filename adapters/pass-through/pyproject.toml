[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spectral-bridge-adapter-pass-through"
dynamic = ["version"]
description = "Pass-through adapter for spectral-bridge"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.135.2", "uvicorn>=0.42", "httpx>=0.28"]

# Versions derive from the repo's git tags (two levels up from this package).
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_bridge_passthrough"]
